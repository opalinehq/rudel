name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing opaline-cli@* tag to resume after a failed publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release_please:
    name: Release Please
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.release_tag == ''
      ) ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      cli_release_created: ${{ steps.release.outputs['apps/cli--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['apps/cli--tag_name'] }}
      cli_sha: ${{ steps.release.outputs['apps/cli--sha'] }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    if: >-
      always() &&
      (
        (
          needs.release_please.outputs.cli_release_created == 'true'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.release_tag != ''
        )
      )
    needs: release_please
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release_please.outputs.cli_sha || inputs.release_tag }}

      - name: Authorize release source
        env:
          CLI_RELEASE_SHA: ${{ needs.release_please.outputs.cli_sha }}
          CLI_RELEASE_TAG: ${{ needs.release_please.outputs.cli_tag_name || inputs.release_tag }}
        run: |
          package_version="$(node -p "require('./apps/cli/package.json').version")"
          expected_cli_tag="opaline-cli@${package_version}"

          test "${CLI_RELEASE_TAG}" = "${expected_cli_tag}"

          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git fetch --force --no-tags origin \
            "refs/tags/${expected_cli_tag}:refs/tags/${expected_cli_tag}"

          checked_out_sha="$(git rev-parse HEAD)"
          cli_tag_sha="$(git rev-parse "refs/tags/${expected_cli_tag}^{commit}")"

          test "${checked_out_sha}" = "${cli_tag_sha}"
          if [[ -n "${CLI_RELEASE_SHA}" ]]; then
            test "${cli_tag_sha}" = "${CLI_RELEASE_SHA}"
          fi
          git merge-base --is-ancestor "${cli_tag_sha}" refs/remotes/origin/main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Require completed manual npm bootstrap
        run: npm view @opalinehq/cli version >/dev/null

      - name: Verify
        run: bun run verify

      - name: Publish @opalinehq/cli with provenance
        working-directory: apps/cli
        env:
          OPALINE_BUILD_POSTHOG_KEY: ${{ vars.OPALINE_BUILD_POSTHOG_KEY }}
          OPALINE_BUILD_POSTHOG_HOST: ${{ vars.OPALINE_BUILD_POSTHOG_HOST }}
        run: |
          test -n "${OPALINE_BUILD_POSTHOG_KEY}"
          test -n "${OPALINE_BUILD_POSTHOG_HOST}"
          version="$(node -p "require('./package.json').version")"
          if npm view "@opalinehq/cli@${version}" version >/dev/null 2>&1; then
            echo "@opalinehq/cli@${version} is already published."
          else
            bun run build
            npm publish --ignore-scripts --access public --provenance
          fi

      - name: Wait for @opalinehq/cli registry availability
        run: |
          version="$(node -p "require('./apps/cli/package.json').version")"
          for attempt in {1..30}; do
            if [[ "$(npm view "@opalinehq/cli@${version}" version 2>/dev/null)" == "${version}" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "@opalinehq/cli@${version} did not become available in time."
          exit 1
